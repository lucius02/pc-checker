# Staat in de repo-root zodat hij geldt voor `cargo` vanuit zowel de root
# (`npm run gen:types`, `--manifest-path src-tauri/Cargo.toml`) als vanuit src-tauri/ (CI).
[env]
# ts-rs: TypeScript-bindings worden bij `cargo test` gegenereerd in src/types/generated.
TS_RS_EXPORT_DIR = { value = "src/types/generated", relative = true }
# u64/u128 als `number` i.p.v. `bigint` (Tauri serialiseert ze als JSON-getallen).
TS_RS_LARGE_INT = "number"
