[package]
name = "pc-checker"
version = "0.1.2"
description = "PC Checker - hardware diagnostics, freeze detection and health suite"
authors = ["lucius02"]
repository = "https://github.com/lucius02/pc-checker"
license = "MIT OR Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix is necessary to keep the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "pc_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.0"
rayon = "1.12.0"
chrono = "0.4"
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
# ETW (per-driver DPC/ISR-meting), driverlijst en QPC-klok. Zelfde versie als `wmi` gebruikt.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Time",
  "Win32_System_ProcessStatus",
  "Win32_System_Performance",
  "Win32_NetworkManagement_WiFi",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Bewust geen `panic = "abort"`: een panic in een WMI-parser of stresstest wordt dan door
# `spawn_blocking` opgevangen en als foutmelding naar de UI gestuurd i.p.v. de app te sluiten.
strip = true
